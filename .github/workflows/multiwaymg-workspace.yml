name: MultiwayMG Rust workspace

on:
  push:
    branches: [multiwaymg, "codex/multiwaymg-**"]
  pull_request:
    branches: [multiwaymg]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --no-default-features
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  allocation:
    name: Serial workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Debug all features
        run: cargo test --locked --manifest-path crates/schwarz-precond/Cargo.toml --all-features --test workspace --test workspace_allocations
      - name: Debug minimal
        run: cargo test --locked --manifest-path crates/schwarz-precond/Cargo.toml --no-default-features --test workspace --test workspace_allocations
      - name: Release all features
        run: cargo test --locked --release --manifest-path crates/schwarz-precond/Cargo.toml --all-features --test workspace --test workspace_allocations
      - name: Release minimal
        run: cargo test --locked --release --manifest-path crates/schwarz-precond/Cargo.toml --no-default-features --test workspace --test workspace_allocations
      - name: Serial Schwarz and concrete within contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir serial-evidence
          git rev-parse HEAD > serial-evidence/metadata.txt
          echo "event=${{ github.event_name }} run=${{ github.run_id }}" >> serial-evidence/metadata.txt
          rustc -Vv >> serial-evidence/metadata.txt
          cargo -V >> serial-evidence/metadata.txt
          cargo test --locked --manifest-path crates/schwarz-precond/Cargo.toml --all-features --test serial_schwarz --test serial_schwarz_allocations 2>&1 | tee serial-evidence/schwarz-debug-all.txt
          cargo test --locked --manifest-path crates/schwarz-precond/Cargo.toml --no-default-features --test serial_schwarz --test serial_schwarz_allocations 2>&1 | tee serial-evidence/schwarz-debug-minimal.txt
          cargo test --locked --release --manifest-path crates/schwarz-precond/Cargo.toml --all-features --test serial_schwarz --test serial_schwarz_allocations 2>&1 | tee serial-evidence/schwarz-release-all.txt
          cargo test --locked --release --manifest-path crates/schwarz-precond/Cargo.toml --no-default-features --test serial_schwarz --test serial_schwarz_allocations 2>&1 | tee serial-evidence/schwarz-release-minimal.txt
          cargo test --locked --manifest-path crates/within/Cargo.toml --all-features --test serial_preconditioner --test serial_preconditioner_allocations 2>&1 | tee serial-evidence/within-debug.txt
          cargo test --locked --release --manifest-path crates/within/Cargo.toml --all-features --test serial_preconditioner --test serial_preconditioner_allocations 2>&1 | tee serial-evidence/within-release.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-schwarz-${{ matrix.os }}
          path: serial-evidence/
          if-no-files-found: error
