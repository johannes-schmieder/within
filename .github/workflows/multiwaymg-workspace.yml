name: MultiwayMG Rust workspace

on:
  push:
    branches: [multiwaymg, "codex/multiwaymg-**"]
  pull_request:
    branches: [multiwaymg]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --no-default-features
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  allocation:
    name: Serial workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Debug all features
        run: cargo test --locked --manifest-path crates/schwarz-precond/Cargo.toml --all-features --test workspace --test workspace_allocations
      - name: Debug minimal
        run: cargo test --locked --manifest-path crates/schwarz-precond/Cargo.toml --no-default-features --test workspace --test workspace_allocations
      - name: Release all features
        run: cargo test --locked --release --manifest-path crates/schwarz-precond/Cargo.toml --all-features --test workspace --test workspace_allocations
      - name: Release minimal
        run: cargo test --locked --release --manifest-path crates/schwarz-precond/Cargo.toml --no-default-features --test workspace --test workspace_allocations
